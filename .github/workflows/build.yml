# Checks the sources on every push to dev, builds them for darwin/arm64 and windows/amd64 as
# vX.Y.Z-dev-YYYYMMDD, and publishes them as the dev-latest prerelease, replacing the previous
# one. A semver tag with a leading v on a commit on main is checked, built for every platform
# it is published for, and published as a release. The browser assets the executable embeds
# are built from web/ before any Go step. Both also carry the Windows notification-area app,
# built on Windows with serve-markdown.exe beside it; the macOS menu bar app job is written and
# switched off until Developer ID signing and notarization are set up.

name: build

on:
  push:
    branches: [dev]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'these files are not gofmt clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["linux/amd64","linux/arm64","darwin/amd64","darwin/arm64","windows/amd64","windows/arm64"]' || '["darwin/arm64","windows/amd64"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          PLATFORM: ${{ matrix.platform }}
        run: |
          export GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM##*/}"
          binary="serve-markdown-$GOOS-$GOARCH"
          if [ "$GOOS" = "windows" ]; then
            binary="$binary.exe"
          fi
          ldflags=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            ldflags="-X main.buildVersion=$(git describe --tags --abbrev=0 --match 'v[0-9]*')-dev-$(date -u +%Y%m%d)"
          fi
          go build -trimpath -ldflags "$ldflags" -o "dist/$binary" .
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.binary }}
          archive: false
          if-no-files-found: error

  windows-app:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            latest="$GITHUB_REF_NAME"
          else
            latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          fi
          short="${latest#v}"
          short="${short%%-*}"
          ldflags=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            ldflags="-X main.buildVersion=$latest-dev-$(date -u +%Y%m%d)"
          fi
          out=dist/ServeMarkdown-windows
          go build -trimpath -ldflags "$ldflags" -o "$out/serve-markdown.exe" .
          dotnet publish windows/ServeMarkdown.csproj -c Release -o "$out" "-p:Version=$short" \
            --self-contained true -p:EnableCompressionInSingleFile=true
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ServeMarkdown-windows/* -DestinationPath ServeMarkdown-windows-amd64.zip
      - uses: actions/upload-artifact@v7
        with:
          path: ServeMarkdown-windows-amd64.zip
          archive: false
          if-no-files-found: error

  macos-app:
    # Off until the APPLE_* and KEYCHAIN_PASSWORD secrets hold a Developer ID certificate and a notarization login.
    if: false
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -t cert -f pkcs12 -k "$keychain"
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "no 'Developer ID Application' identity in APPLE_CERTIFICATE" >&2
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            latest="$GITHUB_REF_NAME"
          else
            latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          fi
          short="${latest#v}"
          short="${short%%-*}"
          ldflags=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            ldflags="-X main.buildVersion=$latest-dev-$(date -u +%Y%m%d)"
          fi
          contents=dist/ServeMarkdown.app/Contents
          mkdir -p "$contents/MacOS"
          go build -trimpath -ldflags "$ldflags" -o "$contents/MacOS/serve-markdown" .
          swift build -c release --package-path macos
          cp "$(swift build -c release --package-path macos --show-bin-path)/ServeMarkdown" "$contents/MacOS/ServeMarkdown"
          sed "s/@SHORT_VERSION@/$short/g" macos/Info.plist.in > "$contents/Info.plist"
          plutil -lint "$contents/Info.plist"
          printf 'APPL????' > "$contents/PkgInfo"
      - name: Sign
        run: |
          for target in dist/ServeMarkdown.app/Contents/MacOS/serve-markdown dist/ServeMarkdown.app; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp --options runtime \
              --entitlements macos/entitlements.plist "$target"
          done
          codesign --verify --strict --deep --verbose=2 dist/ServeMarkdown.app
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/ServeMarkdown.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/ServeMarkdown.app
          spctl --assess --type execute -vvv dist/ServeMarkdown.app
          ditto -c -k --keepParent dist/ServeMarkdown.app ServeMarkdown-darwin-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          path: ServeMarkdown-darwin-arm64.zip
          archive: false
          if-no-files-found: error
      - name: Remove keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN"
          fi

  release:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    needs: [build, windows-app, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "'$TAG' is not a semver tag with a leading v" >&2
            exit 1
          fi
      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "'$TAG' is not on main" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-from-tag

  dev-release:
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' }}
    needs: [build, windows-app, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --cleanup-tag --yes
          fi
          gh release create dev-latest dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title dev-latest --notes "Built from dev at $GITHUB_SHA."
