# Checks, builds and publishes the release of a pushed semver tag.

name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'these files are not gofmt clean:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        id: build
        env:
          CGO_ENABLED: "0"
          PLATFORM: ${{ matrix.platform }}
        run: |
          export GOOS="${PLATFORM%%/*}" GOARCH="${PLATFORM##*/}"
          binary="serve-markdown"
          if [ "$GOOS" = "windows" ]; then
            binary="$binary.exe"
          fi
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -o "build/$binary" .
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            archive="serve-markdown-$version-$GOOS-$GOARCH.zip"
            (cd build && zip -9 "../dist/$archive" "$binary")
          else
            archive="serve-markdown-$version-$GOOS-$GOARCH.tar.gz"
            tar -czf "dist/$archive" -C build "$binary"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.build.outputs.archive }}
          archive: false
          if-no-files-found: error

  assets:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Archive
        id: archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="serve-markdown-assets-$version.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C render/assets/build .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.archive.outputs.archive }}
          archive: false
          if-no-files-found: error

  windows-app:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          version="${GITHUB_REF_NAME#v}"
          short="${version%%-*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          out=dist/ServeMarkdown-windows
          go build -trimpath -o "$out/serve-markdown.exe" .
          dotnet publish windows/ServeMarkdown.csproj -c Release -o "$out" "-p:Version=$short" \
            --self-contained true -p:EnableCompressionInSingleFile=true
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ServeMarkdown-windows/* -DestinationPath "ServeMarkdown-$env:VERSION-windows-amd64.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: ServeMarkdown-${{ env.VERSION }}-windows-amd64.zip
          archive: false
          if-no-files-found: error

  macos-app:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          short="${version%%-*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          contents=dist/ServeMarkdown.app/Contents
          mkdir -p "$contents/MacOS"
          go build -trimpath -o "$contents/MacOS/serve-markdown" .
          swift build -c release --package-path macos
          cp "$(swift build -c release --package-path macos --show-bin-path)/ServeMarkdown" "$contents/MacOS/ServeMarkdown"
          sed "s/@SHORT_VERSION@/$short/g" macos/Info.plist.in > "$contents/Info.plist"
          plutil -lint "$contents/Info.plist"
          printf 'APPL????' > "$contents/PkgInfo"
      - name: Sign
        run: |
          for target in dist/ServeMarkdown.app/Contents/MacOS/serve-markdown dist/ServeMarkdown.app; do
            codesign --force --sign - --timestamp=none --options runtime \
              --entitlements macos/entitlements.plist "$target"
          done
          codesign --verify --strict --deep --verbose=2 dist/ServeMarkdown.app
          ditto -c -k --keepParent dist/ServeMarkdown.app "ServeMarkdown-$VERSION-darwin-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: ServeMarkdown-${{ env.VERSION }}-darwin-arm64.zip
          archive: false
          if-no-files-found: error

  release:
    needs: [build, assets, windows-app, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "'$TAG' is not a semver tag with a leading v" >&2
            exit 1
          fi
      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "'$TAG' is not on main" >&2
            exit 1
          fi
      - name: Tag of the newest CHANGELOG.md entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          newest="$(awk '/^## / { print $2; exit }' CHANGELOG.md)"
          if [ "v$newest" != "$TAG" ]; then
            echo "'$TAG' is not the version of the newest CHANGELOG.md entry, '$newest'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-from-tag "${prerelease[@]}"
